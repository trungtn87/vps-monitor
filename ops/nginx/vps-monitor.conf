# ==============================================================================
# VPS Monitor V1 — Nginx Reverse Proxy Configuration (Production TLS Termination)
# Recommended deployment pattern for Let's Encrypt certificates on Ubuntu 24.04
# Place this file in /etc/nginx/sites-available/vps-monitor and symlink to /etc/nginx/sites-enabled/
#
# IMPORTANT SECURITY REQUIREMENTS:
# 1. VPS Monitor MUST bind to loopback 127.0.0.1 (HOST=127.0.0.1 in /opt/vps-monitor/.env).
# 2. Block direct public access to port 5050 with UFW firewall:
#      sudo ufw deny 5050/tcp
#      sudo ufw allow 80/tcp
#      sudo ufw allow 443/tcp
# 3. Verify loopback-only binding with:
#      ss -tulnp | grep ":5050"   -> must display 127.0.0.1:5050 (NEVER 0.0.0.0:5050)
# ==============================================================================

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name monitor.11ship.vn; # Replace with your VPS domain or DDNS

    # ACME challenge path for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server (terminates TLS securely with root worker, unprivileged Node runs on loopback)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitor.11ship.vn; # Replace with your VPS domain or DDNS

    # Let's Encrypt certificates (read by Nginx root worker, no unprivileged user permissions issue)
    ssl_certificate /etc/letsencrypt/live/monitor.11ship.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.11ship.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Reverse proxy to local VPS Monitor service running on 127.0.0.1:5050
    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for cross-monitoring heartbeats
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Public health check endpoint
    location = /healthz {
        proxy_pass http://127.0.0.1:5050/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
